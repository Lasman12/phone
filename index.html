<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- לא להופיע בגוגל — רק מי שיש לו קישור -->
  <meta name="robots" content="noindex, nofollow">
  <title>My Phone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <div class="device">
    <div class="screen" id="screen">
      <div class="island"></div>

      <div class="statusbar">
        <span id="status-time">00:00</span>
        <span class="status-icons">
          <svg viewBox="0 0 24 24"><path d="M2 20h3v-4H2zm5 0h3v-7H7zm5 0h3V9h-3zm5 0h3V4h-3z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M12 20.5 2.3 9.4a14 14 0 0 1 19.4 0z"/></svg>
          <span class="battery"><span></span></span>
        </span>
      </div>

      <div class="home" id="home">
        <div class="widget">
          <div class="widget-time" id="widget-time">00:00</div>
          <div class="widget-date" id="widget-date"></div>
        </div>
        <div class="app-grid" id="app-grid"></div>
      </div>

      <button class="home-indicator" id="home-indicator" aria-label="Home"></button>
    </div>
  </div>

  <script src="js/core.js?v=3"></script>
  <!-- כל אפליקציה בקובץ משלה. אפליקציה חדשה = קובץ חדש + שורה כאן -->
  <script src="js/apps/whatsapp.js?v=3"></script>
  <script src="js/apps/youtube.js?v=3"></script>
  <script src="js/apps/music.js?v=3"></script>
  <script src="js/apps/contacts.js?v=3"></script>
  <script src="js/apps/google.js?v=3"></script>
  <script src="js/apps/notes.js?v=3"></script>
  <script src="js/apps/photos.js?v=3"></script>
  <script src="js/apps/flappy.js?v=3"></script>
  <script src="js/apps/snake.js?v=3"></script>
  <script src="js/apps/tony.js?v=3"></script>
  <script>
    Phone.start();
    // אם יצאה גרסה חדשה של האתר — טוענים אותה מיד (במקום לחכות שהזיכרון של הדפדפן יתרוקן)
    const SITE_VERSION = '3';
    fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.text())
      .then(v => {
        v = v.trim();
        if (v && v !== SITE_VERSION && !location.search.includes('v=' + v)) location.replace(location.pathname + '?v=' + v);
      })
      .catch(() => {});
  </script>
</body>
</html>
